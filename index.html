<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zzapkart – Online Shopping</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="images/logo-icon.png" />
  <meta name="theme-color" content="#1e0b3d" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo"><img src="images/logo-full.png" alt="Zzapkart" /></a>
    <div class="search-box">
      <input id="search" type="search" placeholder="Search for products, brands and more" autocomplete="off" />
    </div>
    <a href="orders.html" class="nav-link">📦 <span>My Orders</span></a>
    <a href="seller.html" class="nav-link sell-link">🏪 <span>Sell</span></a>
    <a href="cart.html" class="cart-link">
      🛒 Cart <span id="cart-count" class="badge">0</span>
    </a>
  </header>
  <nav class="cat-nav" id="cat-nav"></nav>

  <section class="hero" id="hero">
    <div>
      <h1>Big Saving Days</h1>
      <p>Up to 50% off on electronics, fashion, home &amp; more</p>
    </div>
    <div class="hero-emoji">🛍️</div>
  </section>

  <main class="container">
    <!-- Normal view: saari categories + har category ka section -->
    <div id="browse-view">
      <h2 class="section-title">Shop by Category</h2>
      <div class="cat-tiles" id="cat-tiles"></div>
      <div id="sponsored"></div>
      <div id="category-sections"></div>
    </div>

    <!-- Search view -->
    <div id="search-view" class="hidden">
      <div id="search-brand"></div>
      <p id="result-info" class="result-info"></p>
      <div class="grid" id="search-grid"></div>
      <div id="empty" class="empty hidden">
        <div class="empty-emoji">🔍</div>
        <p>Koi product nahi mila. Kuch aur search karo.</p>
      </div>
    </div>
  </main>

  <footer class="footer">© 2026 Zzapkart Prototype</footer>

  <script src="products.js"></script>
  <script src="catalog.js"></script>
  <script src="store.js"></script>
  <script src="ads.js"></script>
  <script src="cart.js"></script>
  <script src="ui.js"></script>
  <script src="home.js"></script>
</body>
</html>

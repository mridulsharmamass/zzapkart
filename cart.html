<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Cart – Zzapkart</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="images/logo-icon.png" />
  <meta name="theme-color" content="#1e0b3d" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo"><img src="images/logo-full.png" alt="Zzapkart" /></a>
    <div class="search-box">
      <form action="index.html">
        <input type="search" name="q" placeholder="Search for products, brands and more" autocomplete="off" />
      </form>
    </div>
    <a href="orders.html" class="nav-link">📦 <span>My Orders</span></a>
    <a href="seller.html" class="nav-link sell-link">🏪 <span>Sell</span></a>
    <a href="cart.html" class="cart-link">
      🛒 Cart <span id="cart-count" class="badge">0</span>
    </a>
  </header>
  <nav class="cat-nav" id="cat-nav"></nav>

  <main class="container cart-page">
    <section class="cart-items">
      <h2>My Cart</h2>
      <div id="cart-list"></div>
      <div id="cart-empty" class="empty hidden">
        <div class="empty-emoji">🛒</div>
        <p>Aapka cart khaali hai!</p>
        <a href="index.html" class="btn">Shop Now</a>
      </div>
    </section>

    <aside class="summary" id="summary">
      <h3>Price Details</h3>
      <div class="sum-row"><span>Price (<span id="sum-items">0</span> items)</span><span id="sum-mrp">₹0</span></div>
      <div class="sum-row"><span>Discount</span><span id="sum-discount" class="green">−₹0</span></div>
      <div class="sum-row"><span>Delivery</span><span id="sum-delivery" class="green">FREE</span></div>
      <hr />
      <div class="sum-row total"><span>Total Amount</span><span id="sum-total">₹0</span></div>
      <p class="green save-line" id="sum-save"></p>
      <button class="btn checkout-btn" id="checkout">Place Order</button>
    </aside>
  </main>

  <footer class="footer">© 2026 Zzapkart Prototype</footer>

  <script src="products.js"></script>
  <script src="catalog.js"></script>
  <script src="store.js"></script>
  <script src="ads.js"></script>
  <script src="cart.js"></script>
  <script src="ui.js"></script>
  <script src="cartpage.js"></script>
</body>
</html>

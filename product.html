<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product – Zzapkart</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="images/logo-icon.png" />
  <meta name="theme-color" content="#1e0b3d" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo"><img src="images/logo-full.png" alt="Zzapkart" /></a>
    <div class="search-box">
      <form action="index.html" role="search">
        <input type="search" name="q" placeholder="Search for products, brands and more" autocomplete="off" aria-label="Search" />
        <button type="submit" class="search-btn" aria-label="Search"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      </form>
    </div>
    <a href="account.html#orders" class="nav-link">📦 <span>My Orders</span></a>
    <a href="account.html" class="nav-link" id="nav-account">👤 <span>Login</span></a>
    <a href="seller.html" class="nav-link sell-link">🏪 <span>Sell</span></a>
    <a href="cart.html" class="cart-link">
      🛒 Cart <span id="cart-count" class="badge">0</span>
    </a>
  </header>
  <nav class="cat-nav" id="cat-nav"></nav>

  <main class="container">
    <p class="breadcrumb-dark" id="crumbs"></p>
    <div id="pdp"></div>

    <section class="cat-section sponsored-section hidden" id="related-ads">
      <div class="cat-section-head" style="border-left-color:#ff2d95">
        <div><h2>Sponsored products related to this item</h2></div>
      </div>
      <div class="grid" id="related-ads-grid"></div>
    </section>

    <section class="cat-section hidden" id="similar">
      <div class="cat-section-head">
        <div><h2>More in <span id="similar-cat"></span></h2></div>
      </div>
      <div class="grid" id="similar-grid"></div>
    </section>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <script src="products.js"></script>
  <script src="catalog.js"></script>
  <script src="demo-data.js"></script>
  <script src="store.js"></script>
  <script src="media.js"></script>
  <script src="ads.js"></script>
  <script src="cart.js"></script>
  <script src="ui.js"></script>
  <script src="reels.js"></script>
  <script src="product.js"></script>
  <script src="chatbot.js"></script>
</body>
</html>

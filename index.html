<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zzapkart – Online Shopping for Fashion, Electronics, Home & More</title>
  <meta name="description" content="Shop fashion, electronics, home, beauty and more from verified sellers. Free delivery above ₹499, easy returns and cash on delivery." />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="images/logo-icon.png" />
  <meta name="theme-color" content="#1e0b3d" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo"><img src="images/logo-full.png" alt="Zzapkart" /></a>
    <div class="search-box">
      <form id="home-search-form" role="search">
        <input id="search" type="search" placeholder="Search for products, brands and more" autocomplete="off" aria-label="Search" />
        <button type="submit" class="search-btn" aria-label="Search"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      </form>
    </div>
    <a href="account.html#orders" class="nav-link">📦 <span>My Orders</span></a>
    <a href="account.html" class="nav-link" id="nav-account">👤 <span>Login</span></a>
    <a href="seller.html" class="nav-link sell-link">🏪 <span>Sell</span></a>
    <a href="cart.html" class="cart-link">
      🛒 Cart <span id="cart-count" class="badge">0</span>
    </a>
  </header>
  <nav class="cat-nav" id="cat-nav"></nav>

  <h1 class="visually-hidden">Zzapkart — online shopping</h1>
  <!-- Auto-changing banner carousel (built by home.js) -->
  <section class="home-hero" id="hero" aria-roledescription="carousel" aria-label="Zzapkart offers"></section>
  <div class="promises" id="promises"></div>

  <main class="container">
    <!-- Default view: categories, deals, reels, stores and one section per category -->
    <div id="browse-view">
      <section class="home-sec">
        <div class="section-head"><div><h2 class="section-title">Shop by Category</h2><p class="section-sub">Everything you need, in one place</p></div><a href="browse.html" class="link">All categories →</a></div>
        <div class="cat-tiles" id="cat-tiles"></div>
      </section>
      <div id="deals"></div>
      <div id="reels"></div>
      <div id="brand-stores"></div>
      <div id="sponsored"></div>
      <div id="category-sections"></div>
    </div>

    <!-- Search view -->
    <div id="search-view" class="hidden">
      <div id="search-brand"></div>
      <div id="search-stores"></div>
      <p id="result-info" class="result-info"></p>
      <div class="grid" id="search-grid"></div>
      <div id="empty" class="empty hidden">
        <div class="empty-emoji">🔍</div>
        <p>No products found. Try a different search.</p>
      </div>
    </div>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <script src="products.js"></script>
  <script src="catalog.js"></script>
  <script src="demo-data.js"></script>
  <script src="store.js"></script>
  <script src="ads.js"></script>
  <script src="cart.js"></script>
  <script src="ui.js"></script>
  <script src="media.js"></script>
  <script src="reels.js"></script>
  <script src="home.js"></script>
  <script src="chatbot.js"></script>
</body>
</html>

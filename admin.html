<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin – Zzapkart</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="images/logo-icon.png" />
  <meta name="theme-color" content="#1e0b3d" />
</head>
<body class="dash-body">
  <header class="navbar">
    <a href="admin.html" class="logo"><img src="images/logo-full.png" alt="Zzapkart" /></a>
    <span class="seller-tag admin">Super Admin</span>
    <div class="push-right dash-user hidden" id="admin-user">
      <span class="dash-shop" id="admin-name"></span>
      <button class="btn btn-outline btn-sm" id="admin-logout" type="button">Logout</button>
    </div>
  </header>

  <div id="admin-auth" class="hidden"></div>

  <div class="dash hidden" id="admin-app">
    <aside class="dash-side">
      <nav id="dash-nav" aria-label="Admin sections"></nav>
      <a href="index.html" class="dash-store-link" target="_blank" rel="noopener">↗ View site</a>
    </aside>
    <main class="dash-main"><div id="content"></div></main>
  </div>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true">
    <div class="modal-box" id="modal-box"></div>
  </div>

  <script src="products.js"></script>
  <script src="catalog.js"></script>
  <script src="demo-data.js"></script>
  <script src="store.js"></script>
  <script src="media.js"></script>
  <script src="ads.js"></script>
  <script src="cart.js"></script>
  <script src="admin-qc.js"></script>
  <script src="admin.js"></script>
</body>
</html>
